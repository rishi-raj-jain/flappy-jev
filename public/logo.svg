<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flappy Jev">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#8fd6ff"/>
    </linearGradient>
    <linearGradient id="body" x1="150" y1="150" x2="330" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe15a"/>
      <stop offset="1" stop-color="#f7b500"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- soft clouds -->
    <g fill="#ffffff" opacity="0.75">
      <circle cx="96" cy="120" r="26"/>
      <circle cx="132" cy="120" r="34"/>
      <circle cx="170" cy="122" r="24"/>
      <rect x="96" y="120" width="74" height="26"/>
    </g>

    <!-- green pipe on the right with a gap -->
    <g>
      <rect x="356" y="0" width="96" height="150" fill="#5ec26a"/>
      <rect x="344" y="134" width="120" height="34" rx="6" fill="#4aa957"/>
      <rect x="356" y="330" width="96" height="182" fill="#5ec26a"/>
      <rect x="344" y="318" width="120" height="34" rx="6" fill="#4aa957"/>
      <rect x="372" y="0" width="14" height="150" fill="#8fe29a" opacity="0.7"/>
      <rect x="372" y="330" width="14" height="182" fill="#8fe29a" opacity="0.7"/>
    </g>

    <!-- ground -->
    <rect x="0" y="470" width="512" height="42" fill="#ddb26f"/>
    <rect x="0" y="470" width="512" height="12" fill="#7cc043"/>

    <!-- bird -->
    <g transform="rotate(-12 236 262)">
      <circle cx="236" cy="262" r="112" fill="url(#body)" stroke="#c98a00" stroke-width="8"/>
      <!-- belly -->
      <path d="M150 300a112 112 0 0 0 170 34 78 78 0 0 1-170-34z" fill="#fff3c2" opacity="0.75"/>
      <!-- wing (Jev pink accent) -->
      <path d="M150 252c-40 6-58 34-52 66 30 8 62-2 84-26z" fill="#ec4899"/>
      <path d="M150 252c-40 6-58 34-52 66 30 8 62-2 84-26z" fill="#ffffff" opacity="0.15"/>
      <!-- eye -->
      <circle cx="272" cy="228" r="34" fill="#ffffff"/>
      <circle cx="284" cy="230" r="16" fill="#111827"/>
      <circle cx="290" cy="224" r="5" fill="#ffffff"/>
      <!-- beak -->
      <path d="M330 258h56l-18 26h-38z" fill="#f97316"/>
      <path d="M330 284h44l-6 8h-38z" fill="#ea580c"/>
    </g>
  </g>
</svg>
